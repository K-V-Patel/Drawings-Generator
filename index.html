<script>
(function () {
  var path = location.pathname;
  if (!path.endsWith("/")) {
    var leaf = path.slice(path.lastIndexOf("/") + 1);
    path = leaf.indexOf(".") >= 0 ? path.slice(0, path.lastIndexOf("/") + 1) : path + "/";
  }
  var base = document.createElement("base");
  base.href = path;
  document.head.appendChild(base);
})();
</script>
